<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>OSOROI</title>
</head>

<body>
    <main>
        <header>
            <h1>OSOROI</h1>
            <p>───お揃い───</p>
        </header>
        <section class="weather-container">
            <div class="weather">
                <div class="weather-title">今日</div>
                <div class="weather-line"></div>
                <div class="weather-box"></div>
                <div class="weather-info">
                    <div class="temperature">24°</div>
                    <div class="low">18°</div>
                    <div class="condition">CLOUDY</div>
                    <div class="percent">20%</div>
                </div>
            </div>

            <div class="weather">
                <div class="weather-title">明日</div>
                <div class="weather-line"></div>
                <div class="weather-box"></div>
                <div class="weather-info">
                    <div class="temperature">21°</div>
                    <div class="low">16°</div>
                    <div class="condition">RAIN</div>
                    <div class="percent">70%</div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
